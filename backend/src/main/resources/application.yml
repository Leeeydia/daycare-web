spring:
  application:
    name: daycare
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway 마이그레이션으로만 관리한다
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    default-property-inclusion: always

server:
  port: 8080
  forward-headers-strategy: framework   # nginx 리버스 프록시 뒤에서 클라이언트 IP/스킴 인식
  error:
    include-message: never
    include-stacktrace: never

app:
  center:
    name: ${CENTER_NAME:주간노인복지센터}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    url-prefix: /uploads
    max-bytes: 5242880          # 5MB
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    initial-username: ${ADMIN_INITIAL_USERNAME:admin}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
    initial-name: ${ADMIN_INITIAL_NAME:센터장}
  sms:
    enabled: ${SMS_ENABLED:true}
    from: ${SMS_FROM:}
    admin-phone: ${SMS_ADMIN_PHONE:}
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    base-url: https://api.solapi.com

logging:
  level:
    com.daycare: INFO

# 로컬 개발 프로필 — docker compose up -d mysql (또는 로컬 MySQL 8.0) 기준
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/daycare?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:daycare}
    password: ${DB_PASSWORD:localpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  admin:
    # 로컬 전용 초기 비밀번호. 운영에서는 반드시 환경변수로 주입한다.
    initial-password: ${ADMIN_INITIAL_PASSWORD:daycare1234!}
  sms:
    # 로컬에서는 FakeSmsSender가 콘솔에 로그만 남긴다. (실제 발송 없음)
    admin-phone: ${SMS_ADMIN_PHONE:010-0000-0000}

logging:
  level:
    com.daycare: DEBUG
    org.hibernate.SQL: DEBUG
